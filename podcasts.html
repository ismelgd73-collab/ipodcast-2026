*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);min-height:100vh;background:var(--bg);background-attachment:fixed;padding-bottom:360px}
body[data-mode=vintage] h2,body[data-mode=vintage] .brand{font-family:'Playfair Display',Georgia,serif}
body[data-mode=clasico] .brand{font-family:Orbitron,monospace;color:var(--acc);text-shadow:0 0 8px rgba(255,140,30,.6)}
header{position:sticky;top:0;z-index:5;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--hdr);border-bottom:1px solid var(--line);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
body[data-mode=clasico] header{border-bottom:2px solid #ff9b30}
body[data-mode=vintage] header{border-bottom:3px solid #b8893b}
.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;margin-right:6px}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.clima{margin-left:auto;font-size:13px;color:var(--mut);white-space:nowrap}
.wtx{display:none}@media(min-width:700px){.wtx{display:inline}}
.sp{flex:1}
header .btn{padding:7px 13px;font-size:13px;margin:0}
main{padding:14px;max-width:1180px;margin:auto}
h2{margin:24px 0 10px;font-size:21px}
.secsub{font-size:12px;color:var(--mut);margin:-6px 0 10px}

const set=(id,t)=>{const x=$(id);if(x)x.textContent=t};
const all=(sel,f)=>document.querySelectorAll(sel).forEach(f);
function toast(t){const x=$('toast');x.textContent=t;x.style.opacity=1;clearTimeout(x._t);x._t=setTimeout(()=>x.style.opacity=0,1800)}
function tap(b){b.classList.add('down');setTimeout(()=>b.classList.remove('down'),230)}

/* ================= DATOS ================= */
function jsonp(url){return new Promise((res,rej)=>{const cb='cb'+Math.random().toString(36).slice(2),s=document.createElement('script');
 window[cb]=d=>{res(d);delete window[cb];s.remove()};s.onerror=()=>{rej('error de conexión');s.remove()};
 setTimeout(()=>{if(window[cb]){window[cb]=()=>{};s.remove();rej('tiempo agotado')}},12000);
 s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s)})}
const IT='https://itunes.apple.com/';
const pais=()=>idioma=='es'?'es':paisOtro;
const pod=r=>({id:r.collectionId||r.id,name:r.collectionName||r.name,artist:r.artistName,feedUrl:r.feedUrl,
 img:(r.artworkUrl600||r.artworkUrl100||'').replace('100x100','600x600'),genre:r.primaryGenreName||'',
 genreIds:(r.genreIds||(r.genres||[]).map(g=>g.genreId)||[]).map(String)});
const search=(t,n=30)=>jsonp(IT+'search?media=podcast&country='+pais()+'&limit='+n+'&term='+encodeURIComponent(t)).then(d=>d.results.map(pod));
async function topPods(){if(topCache.length&&topCache._p==pais())return topCache;
 try{const r=await fetch('https://rss.applemarketingtools.com/api/v2/'+pais()+'/podcasts/top/100/podcasts.json');const d=await r.json();topCache=d.feed.results.map(pod)}
 catch(e){topCache=await search(idioma=='es'?'podcast español':'podcast')}
 topCache._p=pais();return topCache}
const isVid=e=>e.episodeContentType=='video'||/^(mp4|m4v|mov|webm)$/i.test(e.episodeFileExtension||'')||/\.(mp4|m4v|mov|webm)(\?|$)/i.test(e.episodeUrl||'');
const enCurso=()=>Object.values(prog).filter(p=>p.t>5&&!p.done).sort((a,b)=>b.when-a.when);
function genreOf(p){for(const id of p.genreIds||[])if(GEN[id])return{id,name:GEN[id]};
 if(GEN_EN[p.genre])return{id:String(GEN_EN[p.genre]),name:GEN[GEN_EN[p.genre]]};return p.genre?{id:null,name:p.genre.toLowerCase()}:null}
async function resolveName(n){const k='rs:'+n,c=S(k);if(c&&Date.now()-c.ts<7*864e5)return c.p;
 try{const l=await search(n,8);const q=norm(n);const p=l.find(x=>q.includes(norm(x.name))||norm(x.name).includes(q))||l.find(x=>norm(x.name).split(' ').some(w=>w.length>3&&q.includes(w)))||l[0];
  if(p)W(k,{ts:Date.now(),p});return p||null}catch(e){return null}}
async function feedInfo(url){if(!url)return null;try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),7000);
 const r=await fetch(url,{signal:ctl.signal});const x=new DOMParser().parseFromString(await r.text(),'text/xml');const ch=x.querySelector('channel');if(!ch)return null;
 const g=t=>{const e=ch.getElementsByTagName(t)[0];return e?e.textContent:''};
 const desc=[...ch.children].find(e=>e.tagName=='description')?.textContent||g('itunes:summary');
 const seen=new Set(),persons=[];for(const e of x.getElementsByTagName('podcast:person')){const n=e.textContent.trim();if(n&&!seen.has(n)){seen.add(n);persons.push({n,img:e.getAttribute('img'),role:e.getAttribute('role')})}if(persons.length>=10)break}
 return{desc,persons}}catch(e){return null}}
function coverColor(url){return new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=24;const g=c.getContext('2d');g.drawImage(i,0,0,24,24);
 const d=g.getImageData(0,0,24,24).data;let r=0,gg=0,b=0,n=0;for(let k=0;k<d.length;k+=4){r+=d[k];gg+=d[k+1];b+=d[k+2];n++}res(`rgb(${Math.round(r/n*.72)},${Math.round(gg/n*.72)},${Math.round(b/n*.72)})`)}catch(e){res(null)}};
 i.onerror=()=>res(null);setTimeout(()=>res(null),5000);i.src=url})}

const tabs={inicio:'🏠 Inicio',fav:'⭐ Favoritos',explorar:'🔎 Explorar',cola:'📋 Cola',importar:'📥 Importar'};
function nav(){const a=curView.t;
 $('modos').innerHTML=Object.entries(MODOS).map(([k,v])=>`<button class="btn ${k==modo?'on':''}" onclick="setModo('${k}')">${v}</button>`).join('')+
  (modo=='moderno'?`<select onchange="setBtn(this.value)" title="Estilo de botones">${Object.entries(BOTONES).map(([k,v])=>`<option value="${k}" ${k==btnStyle?'selected':''}>Botones: ${v}</option>`).join('')}</select>`:'')+
  (modo=='clasico'?`<select onchange="setTeclas(this.value)" title="Estilo de teclas">${Object.entries(TECLAS).map(([k,v])=>`<option value="${k}" ${k==teclas?'selected':''}>${v}</option>`).join('')}</select>`:'');
 $('tabs').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="btn ${k==a?'on':''}" onclick="show({t:'${k}'})">${v}</button>`).join('')+
  `<span class="sp"></span><button class="btn ${idioma=='es'?'on':''}" onclick="setIdioma('es')">🇪🇸 Castellano</button><button class="btn ${idioma!='es'?'on':''}" onclick="setIdioma('otros')">🌍 Otros idiomas</button>`+

function setModo(m){modo=m;W('modo',m);document.body.dataset.mode=m;nav();renderSkin()}

/* ================= NAVEGACIÓN CON "ATRÁS" ================= */
function show(v){hist.push(curView);if(hist.length>40)hist.shift();curView=v;render(v);scrollTo(0,0)}
function back(){const v=hist.pop();if(v){curView=v;render(v);scrollTo(0,0)}}
const app=h=>$('app').innerHTML=(hist.length?`<button class="btn back" onclick="back()">← Atrás</button>`:'')+h;
const onView=v=>JSON.stringify(curView)===JSON.stringify(v);
async function render(v){nav();app('Cargando…');try{
 if(v.t=='inicio')return renderInicio();
 if(v.t=='fav'){const l=Object.values(favs);return app('<h2>⭐ Favoritos</h2>'+(l.length?`<div class="grid">${cards(l)}</div>`:'Aún no tienes favoritos. Pulsa «Seguir» en un podcast para añadirlo.'))}
 if(v.t=='explorar')return renderExplorar(v.q);
 if(v.t=='cola')return renderCola();
 if(v.t=='importar')return app(`<h2>📥 Importar</h2><p>Sube un archivo OPML exportado de iVoox u otra app de podcasts. Los podcasts se añadirán a Favoritos.</p><input type="file" accept=".opml,.xml" onchange="importOPML(this.files[0])"><div id="imp"></div>`);
 if(v.t=='pod')return await renderPod(v.id);
 }catch(e){app('⚠️ No se pudo cargar: '+e+'. Comprueba la conexión y vuelve a intentarlo.')}}

/* ================= PANTALLAS ================= */
const cards=l=>`<div class="row">${l.map((p,i)=>{window['P'+p.id]=p;return `<div class="card" onclick="show({t:'pod',id:${p.id}})"><img src="${p.img}" loading="lazy" alt=""><div class="cn">${esc(p.name)}</div>${p.rank?`<div class="rank">#${p.rank}</div>`:''}${p.cap?`<div class="cap">${esc(p.cap)}</div>`:''}</div>`}).join('')}</div>`;
const sec=(id,t,sub)=>`<h2>${t}</h2>${sub?`<div class="secsub">${sub}</div>`:''}<div id="s_${id}">Cargando…</div>`;
const fill=(id,h)=>{const x=$(id);if(x)x.innerHTML=h};
async function fillList(id,list,rank){const v=curView;const r=await Promise.all(list.map(async(it,i)=>{const p=await resolveName(it.n);return p?{...p,cap:it.p,rank:rank?i+1:0}:null}));
 if(onView(v))fill('s_'+id,cards(r.filter(Boolean)))}
async function renderInicio(){const v=curView;let h='';const cont=enCurso();
 if(cont.length){const c=cont[0];h+=`<div class="hero"><img src="${c.img}" alt=""><div><div class="hk">Continuar donde lo dejaste</div><div class="ht">${esc(c.title)}</div><div class="hs">${esc(c.pod)} · minuto ${fmt(c.t)}</div><button class="btn pri big" onclick="play(${c.id})">▶ Continuar</button></div></div>`;
  if(cont.length>1)h+='<h2>⏸️ Otros a medias</h2>'+cont.slice(1,6).map(epRow).join('')}
 if(idioma=='es')h+=sec('esc','🔥 Más escuchados en España',`Según ${LISTAS.fuenteEscuchados} · lista actualizada en ${LISTAS.actualizado}`)+sec('pre','🏆 Premiados',LISTAS.fuentePremiados);
 h+=sec('tend','📈 Tendencia ahora','Ranking diario de Apple Podcasts · '+(idioma=='es'?'España':PAISES[paisOtro]));
 const fl=Object.values(favs);if(fl.length)h+=sec('sug','💡 Sugerencias para ti','Según los temas de tus favoritos');
 app(h);
 if(idioma=='es'){fillList('esc',LISTAS.escuchados,true);fillList('pre',LISTAS.premiados)}
 topPods().then(l=>{if(onView(v))fill('s_tend',cards(l.slice(0,40)))}).catch(e=>fill('s_tend','⚠️ '+e));
 if(fl.length){const f=fl[Math.floor(Math.random()*fl.length)];relatedTheme(f).then(l=>{if(onView(v))fill('s_sug',cards(l.filter(p=>!favs[p.id])))}).catch(()=>fill('s_sug',''))}}
async function renderExplorar(q){app(`<input type="text" id="q" placeholder="Buscar podcast, presentador o tema…" value="${esc(q||'')}" onkeydown="if(event.key=='Enter'&&this.value.trim())show({t:'explorar',q:this.value.trim()})">
 <h2>Temáticas</h2>${TEMAS.map(x=>`<span class="tag" onclick="show({t:'explorar',q:'${x}'})">${x}</span>`).join('')}<div id="res"></div>`);
 if(!q)return;const v=curView;fill('res','Buscando…');const l=await search(q);if(onView(v))fill('res',`<h2>Resultados: ${esc(q)}</h2>`+(l.length?cards(l):'Sin resultados.'))}
function epRow(e){window['E'+e.id]=e;const pr=prog[e.id];const pct=pr&&e.dur?Math.min(100,Math.round(pr.t*100000/e.dur)):0;
 return `<div class="erow"><img src="${e.img}" loading="lazy" alt=""><div class="ebody"><div class="et">${pct&&!pr.done?'<span class="dot"></span>':''}${esc(e.title)}</div><div class="ep2">${esc(e.pod)}</div>
 <div class="ed" onclick="this.classList.toggle('open')">${esc(strip(e.desc))}</div>
 <div class="emeta">${fecha(e.date)}${e.dur?' · '+durTxt(e.dur):''}${e.video?' · 🎬 vídeo':''}${pct?` · ${pr.done?'escuchado':pct+'% escuchado'}`:''}</div>
 <div class="eact"><button class="ibtn" onclick="addQ(${e.id})" title="Añadir a la cola">＋</button><a class="ibtn" href="${e.url}" target="_blank" download title="Descargar">⬇</a><span class="sp"></span><button class="pbtn" onclick="play(${e.id})" title="Reproducir">▶</button></div></div></div>`}
async function renderPod(id){const v=curView;
 const d=await jsonp(IT+'lookup?country='+pais()+'&entity=podcastEpisode&limit=60&id='+id);
 const info=d.results.find(r=>r.kind=='podcast'||r.wrapperType=='track')||d.results[0];if(!info)throw 'no se encontró el podcast';
 const p=pod(info);window['P'+id]=p;
 const eps=d.results.filter(r=>r.wrapperType=='podcastEpisode').map(e=>({id:e.trackId,pid:id,pod:p.name,title:e.trackName,desc:e.description,url:e.episodeUrl,img:e.artworkUrl600||p.img,date:e.releaseDate,video:isVid(e),dur:e.trackTimeMillis}));
 const g=genreOf(p);
 app(`<div class="phead" id="phead"><img class="pcov" src="${p.img}" alt=""><div class="pmeta"><div class="ptype">Pódcast</div><h1 class="ptitle">${esc(p.name)}</h1><div class="pauth">${esc(p.artist)}</div></div></div>
 <div class="pact"><button class="btn follow ${favs[id]?'on':''}" onclick="fav(${id})">${favs[id]?'✓ Siguiendo':'Seguir'}</button>${eps[0]?`<button class="pbig" onclick="play(${eps[0].id})" title="Reproducir el último episodio">▶</button>`:''}</div>
 <div class="pgrid"><div><h2>Todos los episodios</h2>${eps.map(epRow).join('')||'No se encontraron episodios.'}</div>
 <aside><h2>Información</h2><p class="pdesc" id="pdesc">${eps[0]?'Último episodio: '+esc(trunc(strip(eps[0].desc),300)):''}</p>
 <div>${g?`<span class="chip" onclick="show({t:'explorar',q:'${esc(g.name)}'})">${esc(capi(g.name))}</span>`:''}</div><div id="ppl"></div></aside></div>
 <h2>👤 De los mismos protagonistas</h2><div id="relP">Buscando…</div>
 <h2>🎭 Más de ${esc(g?g.name:'esta temática')}</h2><div id="relT">Buscando…</div>`);
 coverColor(p.img).then(c=>{const h=$('phead');if(h&&c&&onView(v))h.style.setProperty('--pc',c)});
 people=(p.artist||'').split(/,|\s+y\s+|\s*&\s*|\s+e\s+/).map(s=>s.trim()).filter(n=>n&&n.length<45&&norm(n)!==norm(p.name)).map(n=>({n}));
 renderPeople();
 relatedPeople(p).then(l=>{if(onView(v))fill('relP',l.length?cards(l):'No he encontrado otros podcasts de los mismos protagonistas.')});
 relatedTheme(p).then(l=>{if(onView(v))fill('relT',l.length?cards(l):'No he encontrado podcasts parecidos.')}).catch(()=>fill('relT',''));
 feedInfo(p.feedUrl).then(fi=>{if(!fi||!onView(v))return;if(fi.desc)set('pdesc',trunc(strip(fi.desc),700));
  if(fi.persons.length){const ks=new Set(people.map(x=>norm(x.n)));fi.persons.forEach(x=>{if(!ks.has(norm(x.n)))people.push(x)});renderPeople();
   relatedPeople(p).then(l=>{if(onView(v)&&l.length)fill('relP',cards(l))})}})}
function renderPeople(){fill('ppl',people.length?'<div class="secsub" style="margin:12px 0 4px">Presentadores e invitados</div>'+people.map((x,i)=>`<span class="chip" onclick="person(${i})">👤 ${esc(x.n)}</span>`).join(''):'')}
async function relatedPeople(p){const names=people.slice(0,4).map(x=>x.n);if(!names.length&&p.artist)names.push(p.artist);
 const out=[],seen=new Set([String(p.id)]);
 for(const n of names){try{const l=await search(n,20);const q=norm(n);for(const r of l){if(seen.has(String(r.id)))continue;if(norm(r.artist).includes(q)||norm(r.name).includes(q)){seen.add(String(r.id));out.push(r)}}}catch(e){}}
 return out.slice(0,20)}
async function relatedTheme(p){const g=genreOf(p);if(!g)return [];const seen=new Set([String(p.id)]),out=[];
 const add=x=>{if(!seen.has(String(x.id))){seen.add(String(x.id));out.push(x)}};
 try{const top=await topPods();if(g.id)top.filter(x=>x.genreIds.includes(g.id)).forEach(add)}catch(e){}
 try{(await search(g.name,40)).filter(x=>!g.id||x.genreIds.includes(g.id)).forEach(add)}catch(e){}
 return out.slice(0,24)}
function fav(id){const p=window['P'+id];if(favs[id])delete favs[id];else favs[id]=p;W('favs',favs);
 const b=document.querySelector('.follow');if(b){b.classList.toggle('on',!!favs[id]);b.textContent=favs[id]?'✓ Siguiendo':'Seguir'}toast(favs[id]?'⭐ Añadido a favoritos':'Quitado de favoritos')}
async function person(i){const x=people[i];if(!x)return;const box=$('mbox');$('modal').style.display='flex';
 box.innerHTML=`${x.img?`<img src="${esc(x.img)}" alt="">`:''}<h3>${esc(x.n)}</h3>${x.role?`<p style="color:var(--mut)">${esc(x.role)}</p>`:''}<p>Buscando biografía…</p>`;
 try{const r=await fetch('https://es.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(x.n));if(!r.ok)throw 0;const d=await r.json();if(d.type=='disambiguation')throw 0;
  box.innerHTML=`${d.thumbnail?`<img src="${d.thumbnail.source}" alt="">`:(x.img?`<img src="${esc(x.img)}" alt="">`:'')}<h3>${esc(d.title)}</h3><p>${esc(d.extract)}</p><button class="btn" onclick="$('modal').style.display='none';show({t:'explorar',q:'${esc(x.n)}'})">Ver sus podcasts</button>`}
 catch(e){box.innerHTML=`${x.img?`<img src="${esc(x.img)}" alt="">`:''}<h3>${esc(x.n)}</h3><p>No he encontrado su biografía en Wikipedia.</p><button class="btn" onclick="$('modal').style.display='none';show({t:'explorar',q:'${esc(x.n)}'})">Ver sus podcasts</button>`}}
function addQ(id){const e=window['E'+id];if(!e)return;if(!queue.find(q=>q.id==id)){queue.push(e);W('queue',queue)}toast('➕ Añadido a la cola');set('qn',queue.length)}
function renderCola(){app('<h2>📋 Cola de reproducción</h2>'+(queue.length?queue.map((e,i)=>`<div class="erow"><img src="${e.img}" alt=""><div class="ebody"><div class="et">${i+1}. ${esc(e.title)}</div><div class="ep2">${esc(e.pod)}</div>
 <div class="eact"><button class="btn pri sm" onclick="play(${e.id})">▶ Reproducir</button><button class="btn sm" onclick="mv(${i},-1)">⬆</button><button class="btn sm" onclick="mv(${i},1)">⬇</button><button class="btn sm" onclick="rmQ(${i})">✖ Quitar</button></div></div></div>`).join(''):'La cola está vacía. Pulsa ＋ en cualquier episodio para añadirlo.'))}
function mv(i,d){const j=i+d;if(j<0||j>=queue.length)return;[queue[i],queue[j]]=[queue[j],queue[i]];W('queue',queue);renderCola()}
function rmQ(i){queue.splice(i,1);W('queue',queue);renderCola();set('qn',queue.length)}
async function importOPML(f){const txt=await f.text();const x=new DOMParser().parseFromString(txt,'text/xml');
 const outs=[...x.querySelectorAll('outline')].filter(o=>o.getAttribute('xmlUrl'));const box=$('imp');let ok=0;
 for(const o of outs){const name=o.getAttribute('title')||o.getAttribute('text');box.innerHTML=`Importando ${esc(name)}…`;
  try{const l=await search(name,5);if(l[0]){favs[l[0].id]=l[0];ok++}}catch(e){}}
 W('favs',favs);box.innerHTML=`Importados ${ok} de ${outs.length} podcasts a Favoritos.`}

/* ================= DIBUJOS ================= */
const P2=(cx,cy,r,a)=>[(cx+r*Math.cos(a*Math.PI/180)).toFixed(1),(cy+r*Math.sin(a*Math.PI/180)).toFixed(1)];
function sect(cx,cy,r1,r2,a0,a1){const A=P2(cx,cy,r1,a0),B=P2(cx,cy,r2,a0),C=P2(cx,cy,r2,a1),D=P2(cx,cy,r1,a1);
 return `M${A} L${B} A${r2} ${r2} 0 0 1 ${C} L${D} A${r1} ${r1} 0 0 0 ${A} Z`}
const screw=(x,y,r=5)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#scw)" stroke="#333" stroke-width=".6"/><path d="M${x-r*.6} ${y}H${x+r*.6}M${x} ${y-r*.6}V${y+r*.6}" stroke="#2a2a2a" stroke-width="1.1"/>`;

/* Cinta de casete transparente */

 const reel=(cx,cy,dark)=>`<g class="reel"><circle cx="${cx}" cy="${cy}" r="53" fill="rgba(236,238,240,.26)" stroke="rgba(80,85,90,.6)" stroke-width="1.3"/>

  ${[0,120,240].map(a=>`<path d="${sect(cx,cy,22,44,a-27,a+27)}" fill="${dark?'rgba(18,18,18,.82)':'rgba(255,255,255,.2)'}" stroke="rgba(80,85,90,.55)" stroke-width=".9"/>`).join('')}
  ${[60,180,300].map(a=>{const[x,y]=P2(cx,cy,24,a);return `<circle cx="${x}" cy="${y}" r="2.3" fill="rgba(110,110,100,.65)"/>`}).join('')}
  <circle cx="${cx}" cy="${cy}" r="17" fill="#e7e7e1" stroke="#9a9a92" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="12" fill="#fbfbfb" stroke="#c4c4bc"/>
  ${[0,60,120,180,240,300].map(a=>`<rect x="${cx-2}" y="${cy-12}" width="4" height="4.6" fill="#b5b5ac" transform="rotate(${a} ${cx} ${cy})"/>`).join('')}</g>`;
 return `<svg viewBox="0 0 320 200" class="cassette" xmlns="http://www.w3.org/2000/svg"><defs>
 <pattern id="cg" width="3.6" height="3.6" patternUnits="userSpaceOnUse"><path d="M3.6 0H0V3.6" fill="none" stroke="rgba(255,255,255,.2)" stroke-width=".45"/></pattern>
 <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecece4"/><stop offset=".5" stop-color="#d2d2c9"/><stop offset="1" stop-color="#b9b9af"/></linearGradient>
 <radialGradient id="tp"><stop offset="0" stop-color="#6e4a30"/><stop offset=".7" stop-color="#4a2f1d"/><stop offset="1" stop-color="#2f1d11"/></radialGradient>
 <radialGradient id="scw" cx=".35" cy=".35"><stop offset="0" stop-color="#f6f6f6"/><stop offset="1" stop-color="#666"/></radialGradient></defs>
 <rect x="2" y="2" width="316" height="196" rx="11" fill="rgba(168,174,180,.42)" stroke="rgba(55,60,65,.85)" stroke-width="1.6"/>

 const knob=(x,id,lab)=>`<g transform="translate(${x} 176)"><circle r="19" fill="rgba(0,0,0,.45)"/><g id="${id}" class="knob"><g id="${id}r"><circle r="17" fill="url(#kn1)" stroke="#555" stroke-width=".8"/>

 return `<svg viewBox="0 0 360 262" xmlns="http://www.w3.org/2000/svg"><defs>

 <radialGradient id="kn1" cx=".35" cy=".3"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#bcbcbc"/><stop offset="1" stop-color="#6a6a6a"/></radialGradient>
 <radialGradient id="kn2" cx=".4" cy=".35"><stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#9a9a9a"/></radialGradient>
 <linearGradient id="dgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.12)"/><stop offset=".4" stop-color="rgba(255,255,255,0)"/></linearGradient></defs>
 <rect x="6" y="10" width="348" height="250" rx="34" fill="rgba(0,0,0,.4)"/>

 <rect x="96" y="153" width="168" height="44" fill="url(#dgl)"/>

function showDeck(insert){showCassette(insert)}

/* ================= ASPECTO DEL REPRODUCTOR ================= */
function renderSkin(){
 const extras=`<div class="extras">${modo!='vintage'?`<label class="vol" title="Volumen">🔊<input type="range" id="volr" min="0" max="100" value="${Math.round(vol*100)}" oninput="setVol(this.value/100)"></label>`:''}
 <select onchange="setRate(this.value)" title="Velocidad">${[0.75,1,1.25,1.5,1.75,2].map(v=>`<option value="${v}" ${v==rate?'selected':''}>Velocidad ${v}×</option>`).join('')}</select>
 <select onchange="setSleep(this.value)" title="Temporizador">${[[0,'💤 Sin temporizador'],[15,'💤 15 min'],[30,'💤 30 min'],[45,'💤 45 min'],[60,'💤 60 min']].map(([v,t])=>`<option value="${v}" ${v==sleepV?'selected':''}>${t}</option>`).join('')}</select>
 <button class="btn" id="vbtn" onclick="toggleVideo()">🎬 Vídeo / 🎧 Audio</button><button class="btn" onclick="show({t:'cola'})">📋 Cola (<span id="qn">${queue.length}</span>)</button></div>`;
 const mini=`<div class="mini"><button class="btn sm" onclick="skip(-30)" title="Atrás 30 s">⏪</button><button class="btn sm pri" id="mpk" onclick="toggle()">▶</button><button class="btn sm" onclick="skip(30)" title="Adelante 30 s">⏩</button><button class="btn sm" onclick="nextQ()" title="Siguiente">⏭</button>
  <div class="mmid"><div class="mt"></div><div class="mprog" onclick="seekFrac(event.offsetX/this.clientWidth)"><div class="mfill"></div></div></div><span class="mtime">0:00 / 0:00</span></div>`;
 const seek=`<input type="range" id="seek" min="0" max="1000" value="0" oninput="seekTo(this.value)">`;
 let h='';
 if(modo=='moderno')h=`<div class="avr"><div class="avdisp"><div class="covw" id="covw">🎧</div><div class="minfo"><div class="avtop"><span class="badge" id="st">■ STOP</span><span class="badge" id="fmtb">AUDIO</span><span class="badge">PODCAST</span></div><div id="ttl" class="ttl1"></div><div id="pod" class="sub"></div>${seek}<div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div></div><div id="vu" class="vubars">${'<i></i>'.repeat(16)}</div></div></div>
  <div class="ctr"><button class="btn" onclick="skip(-30)">⏪ 30</button><button class="btn pri play" id="pk" onclick="toggle()">▶</button><button class="btn" onclick="skip(30)">30 ⏩</button><button class="btn" onclick="nextQ()">⏭</button></div>`+extras;
 if(modo=='clasico')h=`<div class="deck"><div class="door"><div class="win" id="cas"></div><div class="dl">AUTO REVERSE · DECK A</div></div>
  <div class="mid"><div class="vfd"><div class="vrow"><span id="st">■ STOP</span><span><span id="tc">0:00</span> / <span id="td">0:00</span></span></div><div class="marq"><span id="ttl"></span></div>
  <div id="vu" class="vuseg"><div class="ch"><b>L</b>${'<i></i>'.repeat(24)}</div><div class="ch"><b>R</b>${'<i></i>'.repeat(24)}</div><div class="scale"><span>-20</span><span>-10</span><span>-5</span><span>0</span><span>+3</span></div></div></div>
  ${seek}<div class="keys"><button class="key" onclick="tap(this);skip(-30)">◀◀<small>REW 30</small></button><button class="key" id="pk" onclick="toggle()">▶<small>PLAY</small></button><button class="key" id="kpause" onclick="pausar()">❚❚<small>PAUSE</small></button><button class="key" onclick="tap(this);stopP()">■<small>STOP</small></button><button class="key" onclick="tap(this);skip(30)">▶▶<small>FF 30</small></button><button class="key" onclick="tap(this);nextQ()">⏭<small>NEXT</small></button><button class="key" onclick="tap(this);eject()">⏏<small>EJECT</small></button></div>
  ${extras}</div></div>`;
 if(modo=='vintage')h=`<div class="vscene"><div class="vradio">${radioSVG()}</div></div>
  <div class="vhint">Gira los mandos de la radio arrastrando arriba o abajo: el izquierdo es el volumen y el derecho busca dentro del episodio</div>
  <div class="vbar"><span id="st"></span><div class="marq"><span id="ttl"></span></div><span><span id="tc">0:00</span> / <span id="td">0:00</span></span></div>${seek}${extras}`;
 $('skin').innerHTML=mini+h;showDeck(false);
 if(modo=='vintage'){knob('kvol',()=>vol,v=>{setVol(v);toast('🔊 Volumen '+Math.round(v*100)+'%')});knob('kseek',()=>{const m=el();return m&&m.duration?m.currentTime/m.duration:0},v=>seekFrac(v))}
 ui();pad()}
function knob(id,get,setv){const k=$(id);if(!k)return;let sy=null,sv=0;
 k.addEventListener('pointerdown',e=>{sy=e.clientY;sv=get();k.setPointerCapture(e.pointerId);e.preventDefault()});
 k.addEventListener('pointermove',e=>{if(sy==null)return;setv(Math.min(1,Math.max(0,sv+(sy-e.clientY)/160)));ui()});
 k.addEventListener('pointerup',()=>sy=null);k.addEventListener('pointercancel',()=>sy=null);
 k.addEventListener('wheel',e=>{e.preventDefault();setv(Math.min(1,Math.max(0,get()-e.deltaY/1500)));ui()},{passive:false})}
function vkey(i){const k=$('vk'+i);if(i!=1&&k){k.classList.add('down');setTimeout(()=>k.classList.remove('down'),230)}
 [()=>skip(-30),toggle,stopP,()=>skip(30),nextQ][i]()}
function pad(){requestAnimationFrame(()=>document.body.style.paddingBottom=($('player').offsetHeight+30)+'px')}
function togglePmin(){pmin=!pmin;$('player').classList.toggle('min',pmin);$('pmin').textContent=pmin?'▴':'▾';pad()}

/* ================= REPRODUCCIÓN ================= */
const el=()=>document.querySelector('#media video,#media audio');
function saveProg(){const m=el();if(!m||!current)return;prog[current.id]={...current,t:m.currentTime,when:Date.now(),done:!!(m.duration&&m.currentTime>m.duration-30)};W('prog',prog)}
function ui(){const m=el(),on=!!(m&&!m.paused);document.body.classList.toggle('playing',on);
 const t=m?m.currentTime:0,d=m&&isFinite(m.duration)?m.duration:(current&&current.dur?current.dur/1000:0),p=d?Math.min(1,t/d):0;
 set('ttl',current?(modo=='moderno'?current.title:current.pod+' — '+current.title):'Elige un episodio para empezar');set('pod',current?current.pod:'');
 set('st',on?'▶ PLAY':(current?'❚❚ PAUSA':'■ STOP'));set('tc',fmt(t));set('td',fmt(d));
 all('.mt',x=>x.textContent=current?current.pod+' — '+current.title:'Nada en reproducción');all('.mfill',x=>x.style.width=(p*100)+'%');all('.mtime',x=>x.textContent=fmt(t)+' / '+fmt(d));
 set('mpk',on?'❚❚':'▶');
 const pk=$('pk');if(pk){if(modo=='moderno')pk.textContent=on?'❚❚':'▶';else{pk.classList.toggle('lit',on);pk.classList.toggle('down',on)}}
 const kp=$('kpause');if(kp)kp.classList.toggle('down',!!(m&&m.paused&&current&&t>0));
 const v1=$('vk1');if(v1)v1.classList.toggle('down',on);
 set('fmtb',current&&current.video&&videoMode?'VÍDEO':'AUDIO');
 const cw=$('covw');if(cw){const src=current&&current.img||'';if(cw.dataset.src!==src){cw.dataset.src=src;cw.innerHTML=src?`<img src="${src}" alt="">`:'🎧'}}
 const sk=$('seek');if(sk&&document.activeElement!==sk)sk.value=p*1000;
 const tl=$('tl'),tr=$('tr');if(tl){tl.setAttribute('r',20+30*(1-p));tr.setAttribute('r',20+30*p)}
 const dn=$('dn');if(dn){const x=(100+p*160).toFixed(1);dn.setAttribute('x1',x);dn.setAttribute('x2',x)}
 const kv=$('kvolr');if(kv)kv.setAttribute('transform',`rotate(${-135+vol*270})`);const ks=$('kseekr');if(ks)ks.setAttribute('transform',`rotate(${-135+p*270})`);
 const vr=$('volr');if(vr&&document.activeElement!==vr)vr.value=Math.round(vol*100);
 const vb=$('vbtn');if(vb&&current){vb.textContent=!current.video?'🎧 Solo audio':(videoMode?'🎧 Pasar a solo audio':'🎬 Ver vídeo');vb.classList.toggle('off',!current.video)}}
function play(id){const e=window['E'+id]||queue.find(q=>q.id==id)||prog[id];if(!e)return;
 if(current&&el())saveProg();
 const nuevo=!current||current.id!=e.id;current=e;window['E'+id]=e;
 const tag=e.video&&videoMode?'video':'audio';
 $('media').innerHTML=`<${tag} src="${e.url}" autoplay playsinline ${tag=='video'?'controls':''}></${tag}>`;$('media').className=tag=='video'?'vid':'';
 const m=el();m.playbackRate=rate;m.volume=vol;
 m.onloadedmetadata=()=>{if(prog[id]&&!prog[id].done&&prog[id].t)m.currentTime=prog[id].t;m.playbackRate=rate;ui()};
 let last=0;m.ontimeupdate=()=>{const n=Date.now();if(n-last>4000){last=n;saveProg()}ui()};
 m.onplay=ui;m.onpause=()=>{saveProg();ui()};
 m.onended=()=>{prog[id]={...e,t:0,done:true,when:Date.now()};W('prog',prog);nextQ()};
 m.onerror=()=>toast('⚠️ No se puede reproducir este episodio');
 if(nuevo)showDeck(true);ui();pad();
 if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:e.title,artist:e.pod,artwork:[{src:e.img,sizes:'600x600'}]});
  navigator.mediaSession.setActionHandler('seekbackward',()=>skip(-30));navigator.mediaSession.setActionHandler('seekforward',()=>skip(30));navigator.mediaSession.setActionHandler('nexttrack',nextQ)}catch(x){}}}
function toggle(){const m=el();if(!m){const c=enCurso()[0];if(c)play(c.id);else toast('Elige un episodio para empezar');return}m.paused?m.play():m.pause()}
function pausar(){const m=el();if(m){m.paused?m.play():m.pause()}}
function stopP(){const m=el();if(m)m.pause()}
function eject(){const m=el();if(m){m.pause();saveProg()}const s=document.querySelector('#cas svg');
 const fin=()=>{current=null;$('media').innerHTML='';$('media').className='';showDeck(false);ui();pad()};
 if(s){s.classList.add('ej');setTimeout(fin,600)}else fin()}
function nextQ(){if(current){const i=queue.findIndex(q=>q.id==current.id);if(i>=0){queue.splice(i,1);W('queue',queue)}}
 if(queue.length){play(queue[0].id)}else toast('La cola está vacía');set('qn',queue.length)}
function skip(s){const m=el();if(m)m.currentTime=Math.max(0,m.currentTime+s)}
function seekTo(v){seekFrac(v/1000)}
function seekFrac(f){const m=el();if(m&&isFinite(m.duration))m.currentTime=Math.min(1,Math.max(0,f))*m.duration;ui()}
function setVol(v){vol=Math.min(1,Math.max(0,v));W('vol',vol);const m=el();if(m)m.volume=vol}
function setRate(v){rate=+v;const m=el();if(m)m.playbackRate=rate}
function setSleep(v){sleepV=+v;clearTimeout(sleepT);if(sleepV){sleepT=setTimeout(()=>{stopP();sleepV=0;renderSkin();toast('💤 Temporizador: pausado')},sleepV*60000);toast('💤 Se parará en '+sleepV+' min')}}
function toggleVideo(){if(!current)return toast('Primero elige un episodio');if(!current.video)return toast('Este episodio no tiene vídeo');
 if(el())saveProg();videoMode=!videoMode;play(current.id)}

/* ================= VÚMETROS (simulados) ================= */
let lv=[0,0],tg=[0,0],lastT=0;
function vuLoop(ts){const m=el(),on=!!(m&&!m.paused&&!m.muted&&m.volume>0);
 if(ts-lastT>90){lastT=ts;for(let i=0;i<2;i++)tg[i]=on?(Math.random()<.12?.15:.35+Math.random()*.55)*(.5+vol*.5):0}
 for(let i=0;i<2;i++)lv[i]+=(tg[i]-lv[i])*(tg[i]>lv[i]?.5:.15);
 const vu=$('vu');
 if(modo=='clasico'&&vu)vu.querySelectorAll('.ch').forEach((c,i)=>{const n=Math.round(lv[i]*24);c.querySelectorAll('i').forEach((s,j)=>s.classList.toggle('on',j<n))});
 else if(modo=='moderno'&&vu)vu.querySelectorAll('i').forEach((b,j)=>{const h=on?Math.max(.08,Math.min(1,lv[j%2]*(.5+.8*Math.abs(Math.sin(ts/240+j*1.7))))):.06;b.style.height=(h*100)+'%'});
  requestAnimationFrame(vuLoop)}

/* ================= HORA Y TIEMPO (Open-Meteo) ================= */
let tiempo='';
const WC=c=>c==0?['☀️','Despejado']:c<=2?['🌤️','Poco nuboso']:c==3?['☁️','Nublado']:c<=48?['🌫️','Niebla']:c<=57?['🌦️','Llovizna']:c<=67?['🌧️','Lluvia']:c<=77?['🌨️','Nieve']:c<=82?['🌦️','Chubascos']:c<=86?['🌨️','Nieve']:['⛈️','Tormenta'];
function reloj(){const d=new Date();$('clima').innerHTML=`🕒 ${d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}${tiempo?' · '+tiempo:''}`}
function wx(lat,lon){fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`).then(r=>r.json())
 .then(d=>{const c=d.current,[ic,tx]=WC(c.weather_code);tiempo=`${ic} ${Math.round(c.temperature_2m)} °C <span class="wtx">${tx}</span>`;reloj()}).catch(()=>{})}
function initWx(){let hecho=false;const fb=()=>{if(!hecho){hecho=true;wx(40.4168,-3.7038)}};setTimeout(fb,10000);
 if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{if(!hecho){hecho=true;wx(p.coords.latitude,p.coords.longitude)}},fb,{timeout:8000,maximumAge:1800000});else fb()}

/* ================= ARRANQUE ================= */
document.body.dataset.mode=modo;document.body.dataset.btn=btnStyle;document.body.dataset.keys=teclas;
window.addEventListener('resize',pad);
renderSkin();render(curView);reloj();setInterval(reloj,15000);initWx();setInterval(initWx,1800000);requestAnimationFrame(vuLoop);
</script></body></html>
